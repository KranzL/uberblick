name: demo

on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pyproject.toml

      - name: Install uberblick
        run: |
          python -m pip install --upgrade pip
          pip install -e ./scripts

      - name: Generate synthetic snapshot
        run: uberblick synthetic --profile realistic --output /tmp/demo.duckdb

      - name: Render HTML report
        run: |
          mkdir -p ./public/demo
          uberblick report --snapshot /tmp/demo.duckdb --output ./public/demo/index.html

      - name: Write landing redirect
        run: |
          mkdir -p ./public
          cat > ./public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Uberblick demo</title>
            <meta http-equiv="refresh" content="0; url=./demo/">
            <link rel="canonical" href="./demo/">
          </head>
          <body>
            <p>Redirecting to <a href="./demo/">the Uberblick demo report</a>.</p>
          </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
